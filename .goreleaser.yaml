version: 2

project_name: seta

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/seta
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/PeacexF/seta/internal/version.Version={{ .Version }}
      - -X github.com/PeacexF/seta/internal/version.Commit={{ .FullCommit }}
      - -X github.com/PeacexF/seta/internal/version.Date={{ .CommitDate }}
    # Reproducible: binaries don't depend on when or where they were built.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: ["ghcr.io/peacexf/seta"]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/PeacexF/seta
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

# Needs the PeacexF/homebrew-tap repository and a HOMEBREW_TAP_GITHUB_TOKEN
# secret that can push to it.
homebrew_casks:
  - repository:
      owner: PeacexF
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/PeacexF/seta
    description: Posture monitoring as code for public-facing infrastructure
    license: Apache-2.0
    # Prereleases stay out of the tap.
    skip_upload: auto
    hooks:
      post:
        # The binaries aren't notarized; without this macOS refuses to run them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/seta"]
          end

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
