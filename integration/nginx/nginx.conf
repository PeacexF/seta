events {}
http {
    # At this level because they apply before SNI selects a server.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;

    server {
        listen 443 ssl;
        server_name mta-sts.tls.int.test;
        ssl_certificate     /certs/mta-sts.pem;
        ssl_certificate_key /certs/mta-sts.key;
        location = /.well-known/mta-sts.txt {
            default_type text/plain;
            alias /policy/mta-sts.txt;
        }
    }

    # web-good.int.test: expect no tls or http findings.
    server {
        listen 80;
        server_name web-good.int.test;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name web-good.int.test;
        ssl_certificate     /certs/web-good.pem;
        ssl_certificate_key /certs/web-good.key;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location / {
            default_type text/html;
            return 200 "<!doctype html><title>good</title>";
        }
    }

    server {
        listen 443 ssl;
        server_name web-expired.int.test;
        ssl_certificate     /certs/web-expired.pem;
        ssl_certificate_key /certs/web-expired.key;
        location / { return 200; }
    }

    server {
        listen 443 ssl;
        server_name web-mismatch.int.test;
        ssl_certificate     /certs/web-mismatch.pem;
        ssl_certificate_key /certs/web-mismatch.key;
        location / { return 200; }
    }
}
