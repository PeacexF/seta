# web-legacy.int.test on its own IP, so that its protocol settings apply
# before SNI picks a server: TLS 1.0, CBC ciphers, no security headers,
# plain HTTP, and files that should never be served.
events {}
http {
    server {
        listen 80 default_server;
        location / {
            default_type text/html;
            return 200 "<!doctype html><title>legacy</title>";
        }
    }
    server {
        listen 443 ssl default_server;
        ssl_certificate     /certs/web-legacy.pem;
        ssl_certificate_key /certs/web-legacy.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers "ECDHE-ECDSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:@SECLEVEL=0";
        location = /.git/HEAD {
            default_type application/octet-stream;
            return 200 "ref: refs/heads/main\n";
        }
        location = /.env {
            default_type text/plain;
            return 200 "DB_PASSWORD=not-a-real-secret\nAPI_KEY=also-fake\n";
        }
        location / {
            default_type text/html;
            return 200 "<!doctype html><title>legacy</title>";
        }
    }
}
